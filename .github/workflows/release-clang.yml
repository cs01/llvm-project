name: Create Clang Release

on:
  workflow_run:
    workflows: ["Build Null-Safe Clang Binaries"]
    types:
      - completed
    branches:
      - nullsafe-clang-dev

# only one release at a time, cancel any in-flight
concurrency:
  group: release-clang
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    # only create a release if the build succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-clang.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: clang-nullsafe-linux-x86_64
          path: artifacts/

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-clang.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: clang-nullsafe-macos-universal
          path: artifacts/

      - name: Download WASM artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-clang.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: clang-nullsafe-wasm
          path: artifacts/

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Delete the old 'latest' release so we can recreate it cleanly
      - name: Delete previous latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Build (${{ steps.sha.outputs.short }})"
          make_latest: true
          files: |
            artifacts/clang-nullsafe-linux-x86_64.tar.gz
            artifacts/clang-nullsafe-macos-universal.tar.gz
            artifacts/clang-nullsafe-wasm.tar.gz
          body: |
            ## Nullsafe Clang — Latest Build

            Built from commit ${{ github.event.workflow_run.head_sha }}

            This release is automatically updated on every push to `nullsafe-clang-dev`.

            ### What's included:

            **Native Binaries (Linux/macOS):**
            - `clang` - The Nullsafe Clang compiler
            - `clangd` - Language server for IDE integration (VSCode, vim, etc.)

            **WebAssembly:**
            - `clang-nullsafe.wasm` - WebAssembly compiler for browser playground
            - `clang-nullsafe.js` - JavaScript glue code

            ### Installation:

            **Quick install (Linux/macOS):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/cs01/llvm-project/nullsafe-clang-dev/install.sh | bash
            ```

            **Manual install:**
            ```bash
            tar -xzf clang-nullsafe-<platform>.tar.gz
            export PATH=$PWD/bin:$PATH
            clang --version
            ```

            ### Usage:
            ```bash
            # Enable flow-sensitive nullability with nullable-by-default
            clang -fflow-sensitive-nullability -fnullability-default=nullable mycode.c

            # Gradual migration mode (no warnings on unannotated code)
            clang -fflow-sensitive-nullability -fnullability-default=unknown mycode.c

            # Promote warnings to errors
            clang -fflow-sensitive-nullability -fnullability-default=nullable -Werror=nullability mycode.c
            ```

            ### Try it online:
            Interactive WebAssembly playground: https://cs01.github.io/llvm-project/

            See the [README](https://github.com/cs01/llvm-project/blob/nullsafe-clang-dev/README.md) for full documentation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
