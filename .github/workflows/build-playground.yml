name: Build Playground WASM

on:
  push:
    branches:
      - nullability-safety
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      compiler_changed: ${{ steps.filter.outputs.compiler }}
      playground_changed: ${{ steps.filter.outputs.playground }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            compiler:
              - 'clang/**'
              - 'llvm/**'
              - '.github/workflows/build-playground.yml'
              - 'playground/build.sh'
            playground:
              - 'playground/**'

  build-wasm:
    needs: check-changes
    if: needs.check-changes.outputs.compiler_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-wasm-${{ github.sha }}
          restore-keys: |
            ccache-wasm-

      - name: Build clang.wasm
        run: playground/build.sh

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build-wasm/bin/clang.wasm artifacts/
          cp build-wasm/bin/clang.js artifacts/

          # Compress for better download speeds
          gzip -k artifacts/clang.wasm
          gzip -k artifacts/clang.js

          echo "=== Artifact sizes ==="
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playground-wasm-files
          path: artifacts/*

      - name: Update playground-latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: playground-latest
          name: Playground WASM (latest)
          prerelease: true
          files: |
            artifacts/clang.wasm
            artifacts/clang.js
            artifacts/clang.wasm.gz
            artifacts/clang.js.gz
          body: |
            ## Nullability Safety Playground WASM (auto-updated)

            Built from ${{ github.sha }} on ${{ github.ref_name }}.
            This release is automatically updated on every push that changes compiler source.

            Includes embedded C/C++ standard library headers — `#include <memory>`,
            `#include <vector>`, `#include <cassert>`, etc. all work in the playground.

            ### Files:
            - `clang.wasm` - WebAssembly compiler binary
            - `clang.js` - Emscripten JavaScript glue code
            - `*.gz` - Compressed versions for faster downloads

            ### Usage:
            These files power the interactive playground at:
            https://cs01.github.io/llvm-project/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
